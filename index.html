<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e51c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مدیریت آرایشگاه کرمانی — حرفه ای</title>
<style>
:root{--red:#e51c2b;--red2:#b70f1d;--dark:#191b1f;--dark2:#111;--card:#23262c;--muted:#9299a3;--line:#343840;--green:#18b66a;--yellow:#f2b90b}
*{box-sizing:border-box}
html{background:#111;box-sizing:border-box;width:100%;height:100%;overflow-x:hidden}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100dvh;width:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;min-height:100dvh;background:#111;overflow-x:hidden}
header{color:#fff;background:linear-gradient(135deg,#e51c2b,#b70f1d);padding:18px 16px 14px;position:sticky;top:0;z-index:20}
.brand{font-size:23px;font-weight:900;letter-spacing:-.4px}
.sub{font-size:12px;opacity:.88;margin-top:5px}
main{padding:16px;padding-bottom:100px;width:100%;max-width:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.section h2{font-size:17px;margin:0}
.btn{border:0;border-radius:13px;padding:10px 14px;background:var(--red);color:#fff;font-weight:800}
.btn.secondary{background:#343840}
.btn.green{background:var(--green)}
.btn.yellow{background:var(--yellow);color:#111}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{display:flex;flex-direction:column;gap:9px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:#202329;color:#fff;border-radius:13px;outline:none}
.empty{padding:28px;text-align:center;color:#9299a3;background:#202329;border-radius:14px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick .card{min-height:95px}
.stat{font-size:24px;font-weight:900;margin-top:7px}
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#343840;font-size:11px}
.badge.green{background:#123f2c;color:#5ee0a1}
.badge.red{background:#4b171d;color:#ff7b85}
.badge.yellow{background:#493b0b;color:#ffd95a}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--red);border-radius:999px}
.chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding:10px 4px}
.bar{flex:1;background:var(--red);border-radius:8px 8px 2px 2px;min-height:3px}
nav{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:none;height:74px;background:#191b1f;border-top:1px solid #343840;display:grid;grid-template-columns:repeat(5,1fr);z-index:50}
nav button{border:0;background:transparent;color:#9299a3;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.active{color:#fff}
.navicon{font-size:22px;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.show{display:flex}
.sheet{width:100%;max-width:none;max-height:92dvh;overflow:auto;background:#202329;border-radius:20px 20px 0 0;padding:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;color:#c7ccd3;font-size:12px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #3a3e46;background:#17191d;color:#fff;border-radius:11px;outline:none}
textarea{min-height:90px;resize:vertical}
.actionbar{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:#17191d;border:1px solid #343840;border-radius:12px;padding:10px}
.kpi strong{font-size:18px;display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 6px;border-bottom:1px solid #343840;text-align:right}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-weight:800;z-index:200;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{display:block}
@media(max-width:520px){
  main{padding:12px;padding-bottom:96px}
  .form{grid-template-columns:1fr}
  .form .full{grid-column:auto}
  .detail-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">مدیریت آرایشگاه کرمانی</div>
  <div class="sub">مشتری • نوبت • مالی • انبار • قرعه‌کشی • گزارش</div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-page="home" onclick="render('home')"><span class="navicon">⌂</span>خانه</button>
  <button data-page="customers" onclick="render('customers')"><span class="navicon">♙</span>مشتریان</button>
  <button data-page="appointments" onclick="render('appointments')"><span class="navicon">▣</span>نوبت‌ها</button>
  <button data-page="finance" onclick="render('finance')"><span class="navicon">▤</span>مالی</button>
  <button data-page="more" onclick="render('more')"><span class="navicon">☰</span>بیشتر</button>
</nav>
</div>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const todayISO=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const fmtMoney=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>Date.now()+Math.floor(Math.random()*999);

let db={
 customers:[],
 staff:[],
 appointments:[],
 transactions:[],
 products:[],
 winners:[],
 settings:{}
};

function loadDB(){
 try{
  const raw=localStorage.getItem('kermaniSalonDB');
  if(raw) db={...db,...JSON.parse(raw)};
 }catch(e){}
 db.customers=Array.isArray(db.customers)?db.customers:[];
 db.staff=Array.isArray(db.staff)?db.staff:[];
 db.appointments=Array.isArray(db.appointments)?db.appointments:[];
 db.transactions=Array.isArray(db.transactions)?db.transactions:[];
 db.products=Array.isArray(db.products)?db.products:[];
 db.winners=Array.isArray(db.winners)?db.winners:[];
 db.settings=db.settings||{};
 db.customers=db.customers.map(x=>({...x,id:x.id??uid(),name:x.name||'',phone:x.phone||'',birthday:x.birthday||'',visits:Number(x.visits)||0,notes:x.notes||'',createdAt:x.createdAt||todayISO()}));
 db.staff=db.staff.map(x=>({...x,id:x.id??uid(),name:x.name||'',phone:x.phone||'',share:Number(x.share)||0,active:x.active!==false}));
 db.appointments=db.appointments.map(x=>({...x,id:x.id??uid(),customerId:x.customerId||'',name:x.name||'',date:x.date||todayISO(),time:x.time||'',service:x.service||'',price:Number(x.price)||0,status:x.status||'ثبت شد',staffId:x.staffId||'',paid:!!x.paid,transactionId:x.transactionId||''}));
 db.transactions=db.transactions.map(x=>({...x,id:x.id??uid(),type:x.type||'income',amount:Number(x.amount)||0,desc:x.desc||'',date:x.date||todayISO(),time:x.time||'',customerId:x.customerId||'',customerName:x.customerName||'',service:x.service||'',staffId:x.staffId||'',appointmentId:x.appointmentId||''}));
 db.products=db.products.map(x=>({...x,id:x.id??uid(),name:x.name||'',stock:Number(x.stock)||0,min:Number(x.min)||0,price:Number(x.price)||0}));
 db.winners=db.winners.map(x=>({...x,id:x.id??uid()}));
}

function save(){
 localStorage.setItem('kermaniSalonDB',JSON.stringify(db));
}

function toast(msg){
 const t=$('toast');
 t.textContent=msg;
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1800);
}

function openModal(html){
 $('sheet').innerHTML=html;
 $('modal').classList.add('show');
}

function closeModal(){
 $('modal').classList.remove('show');
}

$('modal').addEventListener('click',e=>{
 if(e.target.id==='modal') closeModal();
});

function navActive(page){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
}function dashboard(){
  const inc=sum(db.transactions,t=>t.type==='income'?t.amount:0);
  const exp=sum(db.transactions,t=>t.type==='expense'?t.amount:0);
  const today=todayISO();

  const todayInc=sum(db.transactions,t=>
    t.type==='income'&&t.date===today?t.amount:0
  );

  const todayExp=sum(db.transactions,t=>
    t.type==='expense'&&t.date===today?t.amount:0
  );

  const todayApps=db.appointments
    .filter(a=>a.date===today)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  const low=db.products.filter(p=>
    Number(p.qty)<=Number(p.min)
  );

  const todayMD=today.slice(5);

  const birthdays=db.customers.filter(c=>
    c.birthday&&String(c.birthday).slice(5)===todayMD
  );

  const last=db.transactions
    .slice()
    .reverse()
    .slice(0,5);

  return `
    <div class="grid">

      <div class="card">
        <div class="label">📅 نوبت‌های امروز</div>
        <div class="num">${todayApps.length.toLocaleString('fa-IR')}</div>
      </div>

      <div class="card">
        <div class="label">🎂 تولد امروز</div>
        <div class="num">${birthdays.length.toLocaleString('fa-IR')}</div>
      </div>

      <div class="card">
        <div class="label">⚠️ هشدار موجودی</div>
        <div class="num ${low.length?'red':'green'}">
          ${low.length.toLocaleString('fa-IR')}
        </div>
      </div>

      <div class="card">
        <div class="label">💳 آخرین تراکنش</div>
        <div class="num">
          ${last.length?money(last[0].amount):'—'}
        </div>
      </div>

    </div>

    <div class="section">
      <h2>وضعیت‌های مهم امروز</h2>
    </div>

    <div class="list">

      <div class="row" onclick="render('appointments')">
        <div class="row-main">
          <b>📅 نوبت‌های امروز</b>
          <div class="small">
            ${
              todayApps.length
              ?todayApps.map(a=>
                esc(a.time||'بدون ساعت')+' • '+esc(a.name)
              ).join('، ')
              :'نوبتی ثبت نشده'
            }
          </div>
        </div>
        <span class="tag orange">
          ${todayApps.length.toLocaleString('fa-IR')}
        </span>
      </div>

      <div class="row">
        <div class="row-main">
          <b>🎂 تولد مشتری‌ها</b>
          <div class="small">
            ${
              birthdays.length
              ?birthdays.map(c=>esc(c.name)).join('، ')
              :'تولد امروز ثبت نشده'
            }
          </div>
        </div>
        <span class="tag green">
          ${birthdays.length.toLocaleString('fa-IR')}
        </span>
      </div>

      <div class="row" onclick="render('inventory')">
        <div class="row-main">
          <b>⚠️ هشدار موجودی</b>
          <div class="small">
            ${
              low.length
              ?low.map(p=>
                esc(p.name)+' ('+
                Number(p.qty).toLocaleString('fa-IR')+
                ')'
              ).join('، ')
              :'موجودی همه محصولات مناسب است'
            }
          </div>
        </div>
        <span class="tag">
          ${low.length.toLocaleString('fa-IR')}
        </span>
      </div>

      <div class="row" onclick="render('finance')">
        <div class="row-main">
          <b>💳 آخرین تراکنش‌ها</b>
          <div class="small">
            ${
              last.length
              ?last.slice(0,3).map(t=>
                esc(t.customerName||t.desc||'بدون شرح')+
                ' • '+money(t.amount)
              ).join(' | ')
              :'تراکنشی ثبت نشده'
            }
          </div>
        </div>
        <span>›</span>
      </div>

    </div>

    <div class="grid">

      <div class="card">
        <div class="label">درآمد کل</div>
        <div class="num green">${money(inc)}</div>
      </div>

      <div class="card">
        <div class="label">هزینه کل</div>
        <div class="num red">${money(exp)}</div>
      </div>

      <div class="card">
        <div class="label">سود خالص</div>
        <div class="num">${money(inc-exp)}</div>
      </div>

      <div class="card">
        <div class="label">مشتریان</div>
        <div class="num">
          ${db.customers.length.toLocaleString('fa-IR')}
        </div>
      </div>

    </div>

    <div class="card" style="margin-top:11px">

      <div class="section">
        <b>امروز</b>
        <span class="muted">${todayFa()}</span>
      </div>

      <div class="detail-grid">

        <div class="mini">
          <span class="label">درآمد امروز</span>
          <b class="green">${money(todayInc)}</b>
        </div>

        <div class="mini">
          <span class="label">هزینه امروز</span>
          <b class="red">${money(todayExp)}</b>
        </div>

        <div class="mini">
          <span class="label">نوبت امروز</span>
          <b>${todayApps.length.toLocaleString('fa-IR')}</b>
        </div>

        <div class="mini">
          <span class="label">موجودی کم</span>
          <b class="${low.length?'red':'green'}">
            ${low.length.toLocaleString('fa-IR')}
          </b>
        </div>

      </div>
    </div>

    <div class="quick">

      <button onclick="addCustomer()">
        <span>👤</span>مشتری جدید
      </button>

      <button onclick="addAppointment()">
        <span>📅</span>نوبت جدید
      </button>

      <button onclick="addTx()">
        <span>💰</span>ثبت دخل/خرج
      </button>

    </div>

    <div class="section">
      <h2>نوبت‌های امروز</h2>
      <button class="btn small" onclick="addAppointment()">+ نوبت</button>
    </div>

    <div class="list">
      ${
        todayApps.map(appRow).join('')||
        '<div class="card empty">برای امروز نوبتی ثبت نشده.</div>'
      }
    </div>

    <div class="section">
      <h2>🎂 تولد مشتری‌ها</h2>
      <span class="tag green">۵۰٪ تخفیف</span>
    </div>

    <div class="list">
      ${
        birthdays.map(c=>`
          <div class="row">
            <div class="row-main">
              <b>${esc(c.name)} 🎉</b>
              <div class="small">
                امروز تولدشه • ${esc(c.phone||'شماره ثبت نشده')}
              </div>
            </div>
            <span class="tag green">۵۰٪ تخفیف</span>
          </div>
        `).join('')||
        '<div class="card empty">امروز تولدی ثبت نشده.</div>'
      }
    </div>

    <div class="section">
      <h2>هشدار موجودی</h2>
      <button class="btn light small"
              onclick="render('inventory')">
        انبار
      </button>
    </div>

    <div class="list">
      ${
        low.map(p=>`
          <div class="row">
            <div class="row-main">
              <b>${esc(p.name)}</b>
              <div class="small">
                موجودی ${Number(p.qty).toLocaleString('fa-IR')}
                عدد • حد هشدار ${Number(p.min).toLocaleString('fa-IR')}
              </div>
            </div>
            <span class="tag">⚠️ رو به اتمام</span>
          </div>
        `).join('')||
        '<div class="card empty">✅ موجودی محصولات مناسب است.</div>'
      }
    </div>

    <div class="section">
      <h2>آخرین تراکنش‌ها</h2>
      <button class="btn light small"
              onclick="render('finance')">
        همه
      </button>
    </div>

    <div class="list">
      ${
        last.map(t=>`
          <div class="row">
            <div class="row-main">
              <b>${esc(t.customerName||t.desc||'بدون شرح')}</b>
              <div class="small">
                ${esc(t.service||t.desc||'')}
                • ${esc(t.date)}
                ${t.time?' • '+esc(t.time):''}
              </div>
            </div>

            <span class="tag ${t.type==='income'?'green':''}">
              ${t.type==='income'?'+':'−'} ${money(t.amount)}
            </span>
          </div>
        `).join('')||
        '<div class="card empty">هنوز تراکنشی ثبت نشده.</div>'
      }
    </div>
  `;
}function appRow(a){
  const cls=a.status==='انجام شد'?'green':a.status==='لغو شد'?'':'orange';
  return `<div class="row">
    <div class="row-main">
      <b>${esc(a.time||'بدون ساعت')} • ${esc(a.name)}</b>
      <div class="small">
        ${esc(a.service||'خدمت ثبت نشده')} • ${money(a.price)}
        ${a.staffId?' • '+esc((db.staff.find(s=>String(s.id)===String(a.staffId))||{}).name||''):''}
      </div>
    </div>
    <div class="actionbar">
      <span class="tag ${cls}">${esc(a.status)}</span>
      <button class="iconbtn" onclick="editAppointment(${a.id})">✎</button>
      <button class="iconbtn d" onclick="delAppointment(${a.id})">×</button>
    </div>
  </div>`;
}

function customerRows(arr){
  return arr.map(c=>`
    <div class="row">
      <div class="row-main"
           onclick="customerDetails(${c.id})"
           style="flex:1;cursor:pointer">
        <b>${esc(c.name)}${c.birthday?' 🎂':''}</b>
        <div class="small">
          ${esc(c.phone||'بدون شماره')}
          • ${c.visits.toLocaleString('fa-IR')} مراجعه
          • ${c.chances.toLocaleString('fa-IR')} شانس
        </div>
      </div>

      <div class="actionbar">
        <button class="iconbtn"
                onclick="customerDetails(${c.id})">›</button>
        <button class="iconbtn"
                onclick="editCustomer(${c.id})">✎</button>
        <button class="iconbtn d"
                onclick="delCustomer(${c.id})">×</button>
      </div>
    </div>
  `).join('') ||
  '<div class="card empty">مشتری‌ای ثبت نشده.</div>';
}

function customers(){
  return `
    <div class="section">
      <h2>مشتریان (${db.customers.length.toLocaleString('fa-IR')})</h2>
      <button class="btn" onclick="addCustomer()">+ مشتری</button>
    </div>

    <input class="search"
           id="cs"
           placeholder="جستجوی نام، شماره یا یادداشت..."
           oninput="filterCustomers()">

    <div class="list" id="cl">
      ${customerRows(db.customers)}
    </div>
  `;
}

function filterCustomers(){
  const q=($('cs').value||'').trim().toLowerCase();

  $('cl').innerHTML=customerRows(
    db.customers.filter(c=>
      (c.name+' '+c.phone+' '+c.note)
      .toLowerCase()
      .includes(q)
    )
  );
}

function addCustomer(c=null){
  const edit=!!c;

  openSheet(
    edit?'ویرایش مشتری':'مشتری جدید',

    `
    <div class="form-grid">

      <input class="full"
             id="cn"
             placeholder="نام و نام خانوادگی"
             value="${esc(c?.name||'')}">

      <input id="cp"
             inputmode="tel"
             placeholder="شماره تماس"
             value="${esc(c?.phone||'')}">

      <label class="full small">
        🎂 تاریخ تولد مشتری (شمسی)

        <input class="full"
               id="cbday"
               type="text"
               inputmode="numeric"
               placeholder="مثلاً ۱۳۷۵/۰۵/۲۲"
               value="${esc(birthdayFa(c?.birthday||''))}">

        <span class="small">
          فرمت: سال/ماه/روز — مثال: ۱۳۷۵/۰۵/۲۲
        </span>
      </label>

      <input id="cc"
             type="number"
             min="1"
             placeholder="شانس قرعه‌کشی"
             value="${c?.chances||1}">

      <textarea class="full"
                id="cnote"
                placeholder="یادداشت مشتری">${esc(c?.note||'')}</textarea>

    </div>
    `,

    ()=>{
      const name=$('cn').value.trim();

      if(!name){
        alert('نام مشتری را وارد کنید.');
        return false;
      }

      const rawBirthday=$('cbday').value.trim();
      const birthday=rawBirthday?birthdayISO(rawBirthday):'';

      if(rawBirthday&&!birthday){
        alert(
          'تاریخ تولد را به شکل صحیح شمسی وارد کنید؛ مثال: ۱۳۷۵/۰۵/۲۲'
        );
        return false;
      }

      if(edit){

        Object.assign(c,{
          name,
          phone:$('cp').value.trim(),
          birthday,
          chances:Math.max(
            1,
            Number($('cc').value)||1
          ),
          note:$('cnote').value.trim()
        });

      }else{

        db.customers.unshift({
          id:Date.now(),
          name,
          phone:$('cp').value.trim(),
          birthday,
          chances:Math.max(
            1,
            Number($('cc').value)||1
          ),
          note:$('cnote').value.trim(),
          visits:0,
          created:Date.now()
        });

      }

      save();
      render('customers');
    }
  );
}

function editCustomer(id){
  const c=db.customers.find(x=>x.id==id);
  if(c)addCustomer(c);
}

function customerDetails(id){

  const c=db.customers.find(x=>x.id==id);
  if(!c)return;

  const apps=db.appointments
    .filter(a=>
      String(a.customerId)===String(id) ||
      a.name===c.name
    )
    .sort((a,b)=>
      (b.date+b.time).localeCompare(a.date+a.time)
    );

  const linkedPaid=sum(
    db.transactions,
    t=>
      t.type==='income' &&
      String(t.customerId)===String(id)
        ?t.amount
        :0
  );

  const linkedAppointmentIds=new Set(
    db.transactions
      .filter(t=>
        t.type==='income' &&
        String(t.customerId)===String(id) &&
        t.appointmentId
      )
      .map(t=>String(t.appointmentId))
  );

  const services=apps.filter(
    a=>a.status==='انجام شد'
  );

  const legacyPaid=sum(
    services,
    a=>
      linkedAppointmentIds.has(String(a.id))
        ?0
        :(Number(a.price)||0)
  );

  const paid=linkedPaid+legacyPaid;

  openSheet(
    'پرونده مشتری',

    `
    <div class="card"
         style="box-shadow:none;background:#f7f7f8">

      <b style="font-size:20px">
        ${esc(c.name)}
      </b>

      <div class="small">
        ${esc(c.phone||'شماره ثبت نشده')}
      </div>

      <div class="small">
        🎂 تولد:
        ${c.birthday
          ?esc(birthdayFa(c.birthday))
          :'ثبت نشده'}
      </div>

      <div class="detail-grid">

        <div class="mini">
          <span class="label">مراجعه انجام‌شده</span>
          <b>
            ${services.length.toLocaleString('fa-IR')}
          </b>
        </div>

        <div class="mini">
          <span class="label">مجموع پرداختی</span>
          <b class="green">
            ${money(paid)}
          </b>
        </div>

      </div>

    </div>

    <div class="section">
      <h3>سوابق خدمات و پرداختی</h3>
    </div>

    <div class="list">

      ${
        services.map(a=>{

          const tx=db.transactions.find(t=>
            t.type==='income' &&
            String(t.appointmentId)===String(a.id)
          );

          const staff=db.staff.find(s=>
            String(s.id)===String(a.staffId)
          );

          return `
            <div class="row">

              <div class="row-main">

                <b>
                  ${esc(a.service||'خدمت')}
                </b>

                <div class="small">
                  ${esc(a.date)}
                  ${a.time?' • '+esc(a.time):''}
                </div>

                <div class="small">
                  پرسنل:
                  ${esc(staff?.name||'ثبت نشده')}
                </div>

              </div>

              <span class="tag green">
                ${money(tx?.amount||a.price||0)}
              </span>

            </div>
          `;

        }).join('') ||

        '<div class="card empty">هنوز خدمتی ثبت نشده.</div>'
      }

    </div>
    `
  );
}  <div class="list">${db.transactions.slice().reverse().map(t=>`<div class="row"><div class="row-main"><b>${esc(t.customerName||t.desc||'بدون شرح')}</b><div class="small">${esc(t.service||t.desc||'')} • ${esc(t.date)}${t.time?' • '+esc(t.time):''}${t.staffId?' • پرسنل: '+esc((db.staff.find(s=>String(s.id)===String(t.staffId))||{}).name||''):''}</div><div class="small">${t.type==='income'?'دریافتی':'هزینه'}</div></div><div class="actionbar"><span class="tag ${t.type==='income'?'green':''}">${t.type==='income'?'+':'−'} ${money(t.amount)}</span><button class="iconbtn d" onclick="delTx(${t.id})">×</button></div></div>`).join('')||'<div class="card empty">تراکنشی ثبت نشده.</div>'}</div>`;
}
function addTx(){
  openSheet('ثبت دخل یا خرج',`
    <div class="form-grid">
      <select class="full" id="type"><option value="income">درآمد</option><option value="expense">هزینه</option></select>
      <input id="amount" type="number" inputmode="numeric" placeholder="مبلغ">
      <input id="txdate" type="date" value="${todayISO()}">
      <select class="full" id="txcustomer"><option value="">مشتری (اختیاری)</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <input id="txservice" placeholder="خدمت">
      <input class="full" id="desc" placeholder="شرح (مثلاً خرید مواد...)">
    </div>`,()=>{
      const amount=Number($('amount').value)||0;if(amount<=0){alert('مبلغ را وارد کنید.');return false}
      const customerId=$('txcustomer').value||'';const c=db.customers.find(x=>String(x.id)===String(customerId));
      db.transactions.push({id:Date.now(),type:$('type').value,amount,desc:$('desc').value.trim(),date:$('txdate').value||todayISO(),time:'',customerId,customerName:c?.name||'',service:$('txservice').value.trim(),staffId:'',appointmentId:''});save();render('finance');
    });
}
function delTx(id){if(confirm('این تراکنش حذف شود؟')){db.transactions=db.transactions.filter(x=>x.id!=id);save();render('finance')}}

function inventory(){
  const value=sum(db.products,p=>p.qty*p.buy);
  return `<div class="grid"><div class="card"><div class="label">تعداد کالا</div><div class="num">${db.products.length.toLocaleString('fa-IR')}</div></div><div class="card"><div class="label">ارزش موجودی خرید</div><div class="num">${money(value)}</div></div></div>
  <div class="section"><h2>انبار محصولات</h2><button class="btn" onclick="addProduct()">+ محصول</button></div>
  <div class="list">${db.products.map(p=>`<div class="row"><div class="row-main"><b>${esc(p.name)}</b><div class="small">خرید ${money(p.buy)} • فروش ${money(p.sell)} • حداقل ${p.min}</div></div><div class="actionbar"><span class="tag ${p.qty<=p.min?'':'green'}">${p.qty.toLocaleString('fa-IR')} عدد</span><button class="iconbtn" onclick="stockMove(${p.id},1)">+</button><button class="iconbtn" onclick="stockMove(${p.id},-1)">−</button><button class="iconbtn" onclick="editProduct(${p.id})">✎</button><button class="iconbtn d" onclick="delProduct(${p.id})">×</button></div></div>`).join('')||'<div class="card empty">محصولی ثبت نشده.</div>'}</div>`;
}
function addProduct(p=null){
  const edit=!!p;
  openSheet(edit?'ویرایش محصول':'محصول جدید',`
    <div class="form-grid">
      <input class="full" id="pn" placeholder="نام محصول" value="${esc(p?.name||'')}">
      <input id="qty" type="number" placeholder="موجودی" value="${p?.qty??0}">
      <input id="min" type="number" placeholder="حداقل موجودی" value="${p?.min??1}">
      <input id="buy" type="number" placeholder="قیمت خرید" value="${p?.buy??0}">
      <input id="sell" type="number" placeholder="قیمت فروش" value="${p?.sell??0}">
    </div>`,()=>{
      const name=$('pn').value.trim();if(!name){alert('نام محصول را وارد کنید.');return false}
      if(edit)Object.assign(p,{name,qty:Number($('qty').value)||0,min:Number($('min').value)||1,buy:Number($('buy').value)||0,sell:Number($('sell').value)||0});
      else db.products.push({id:Date.now(),name,qty:Number($('qty').value)||0,min:Number($('min').value)||1,buy:Number($('buy').value)||0,sell:Number($('sell').value)||0});
      save();render('inventory');
    });
}
function editProduct(id){const p=db.products.find(x=>x.id==id);if(p)addProduct(p)}
function stockMove(id,delta){const p=db.products.find(x=>x.id==id);if(!p)return;p.qty=Math.max(0,(Number(p.qty)||0)+delta);save();render('inventory')}
function delProduct(id){if(confirm('این محصول حذف شود؟')){db.products=db.products.filter(x=>x.id!=id);save();render('inventory')}}

function reports(){
  const inc=sum(db.transactions,t=>t.type==='income'?t.amount:0),exp=sum(db.transactions,t=>t.type==='expense'?t.amount:0);
  const done=db.appointments.filter(a=>a.status==='انجام شد').length;
  const max=Math.max(1,...Array.from({length:7},(_,i)=>sum(db.transactions,t=>{const d=new Date();d.setDate(d.getDate()-(6-i));return t.type==='income'&&t.date===d.toISOString().slice(0,10)?t.amount:0})));
  const bars=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const iso=d.toISOString().slice(0,10),v=sum(db.transactions,t=>t.type==='income'&&t.date===iso?t.amount:0);return `<div class="barwrap"><div class="bar" style="height:${Math.max(4,Math.round(v/max*100))}%"></div><div class="barlabel">${d.toLocaleDateString('fa-IR',{weekday:'short'})}</div></div>`}).join('');
  return `<div class="section"><h2>گزارش‌ها</h2></div>
  <div class="grid"><div class="card"><div class="label">کل درآمد</div><div class="num green">${money(inc)}</div></div><div class="card"><div class="label">کل هزینه</div><div class="num red">${money(exp)}</div></div><div class="card"><div class="label">سود خالص</div><div class="num">${money(inc-exp)}</div></div><div class="card"><div class="label">نوبت انجام‌شده</div><div class="num">${done.toLocaleString('fa-IR')}</div></div></div>
  <div class="section"><h2>درآمد ۷ روز اخیر</h2></div><div class="card"><div class="chart">${bars}</div></div>
  <div class="section"><h2>خلاصه عملکرد</h2></div>
  <div class="card"><div class="small">مشتریان</div><div class="num">${db.customers.length.toLocaleString('fa-IR')}</div><div class="progress"><i style="width:${Math.min(100,db.customers.length?70:0)}%"></i></div><div class="small">محصولات انبار: ${db.products.length.toLocaleString('fa-IR')} • نوبت‌ها: ${db.appointments.length.toLocaleString('fa-IR')}</div></div>`;
}

function more(){
  return `<div class="section"><h2>امکانات بیشتر</h2></div>
  <div class="list">
    <div class="row" onclick="render('finance')"><div class="row-main"><b>💰 دخل و خرج</b><div class="small">درآمد، هزینه، سود و حذف تراکنش</div></div><span>›</span></div>
    <div class="row" onclick="render('inventory')"><div class="row-main"><b>📦 انبار و محصولات</b><div class="small">موجودی، قیمت خرید و فروش، هشدار کمبود</div></div><span>›</span></div>
    <div class="row"><div class="row-main"><b>🎂 تبریک تولد + تخفیف ۵۰٪</b><div class="small">با ثبت تاریخ تولد، مشتری در روز تولدش در داشبورد مشخص می‌شود و تخفیف ۵۰٪ برای او قابل ثبت است.</div></div><span class="tag green">۵۰٪</span></div>
    <div class="row" onclick="render('staff')"><div class="row-main"><b>💈 کارکرد پرسنل</b><div class="small">ثبت پرسنل و محاسبه خودکار ۵۰٪ کارکرد</div></div><span>›</span></div>
    <div class="row" onclick="render('reports')"><div class="row-main"><b>📊 گزارش‌ها</b><div class="small">گزارش مالی و درآمد ۷ روز اخیر</div></div><span>›</span></div>
    <div class="row"><div class="row-main"><b>💾 پشتیبان‌گیری</b><div class="small">فایل اطلاعات را برای نگهداری یا انتقال ذخیره کن.</div></div><button class="btn gray small" onclick="backup()">خروجی</button></div>
    <div class="row"><div class="row-main"><b>↩️ بازیابی اطلاعات</b><div class="small">فایل JSON پشتیبان را انتخاب کن.</div></div><input id="restore" type="file" accept=".json" style="width:125px"></div>
    <div class="row"><div class="row-main"><b>🧹 پاک‌سازی اطلاعات</b><div class="small">فقط در صورت نیاز؛ قابل برگشت نیست.</div></div><button class="btn danger small" onclick="wipe()">پاک کردن</button></div>
  </div>
  <div class="card" style="margin-top:12px"><b>نسخه حرفه‌ای</b><div class="small">اطلاعات این برنامه روی همین دستگاه و مرورگر ذخیره می‌شود. برای جلوگیری از از دست رفتن اطلاعات، مرتب خروجی پشتیبان بگیر.</div></div>`;
}
function backup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mohsen-kermani-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('view').addEventListener('change',e=>{
  if(e.target.id!=='restore')return;
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{db=normalize(JSON.parse(r.result));save();alert('بازیابی با موفقیت انجام شد.');render('more')}catch(err){alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(f);
});
function wipe(){if(confirm('همه اطلاعات مشتریان، نوبت‌ها، مالی، انبار و برندگان پاک شود؟')&&confirm('مطمئنی؟ این کار قابل برگشت نیست.')){db={customers:[],appointments:[],transactions:[],products:[],winners:[],staff:[]};save();render('home')}}
function render(page='home'){
  const map={home:dashboard,customers,appointments,lottery,more,finance,inventory,reports,staff};
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  $('view').innerHTML=(map[page]||dashboard)();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));

function stockAlert(){
  const low=db.products.filter(p=>Number(p.qty)<=Number(p.min));
  if(!low.length) return;
  const stamp=new Date().toISOString().slice(0,10);
  if(localStorage.getItem('mk_stock_alert_date')===stamp) return;
  localStorage.setItem('mk_stock_alert_date',stamp);
  setTimeout(()=>{
    alert('⚠️ هشدار موجودی\n\nاین محصولات نزدیک به اتمام یا تمام شده‌اند:\n\n'+
      low.map(p=>'• '+p.name+' — موجودی: '+p.qty+' (حد هشدار: '+p.min+')').join('\n'));
  },700);
}
render('home');

</script>
</body>
</html>
